<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1600px;height:900px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#111}
.stage{width:1600px;height:900px;position:relative;overflow:hidden;background:radial-gradient(ellipse 55% 75% at 0% 10%,#d8e8ff 0%,transparent 60%),radial-gradient(ellipse 55% 70% at 105% 100%,#b9f4df 0%,transparent 58%),linear-gradient(135deg,#e8f1ff,#f5f7ff 48%,#dff8ef)}
.left{position:absolute;left:0;top:0;width:650px;height:900px;padding:110px 45px 100px 110px;display:flex;flex-direction:column;justify-content:center}.brand{display:flex;align-items:center;gap:18px;margin-bottom:48px}.icon{width:72px;height:72px;border-radius:20px;background:#0b172a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;box-shadow:0 16px 30px -12px #7a91b0}.brand-name{font-size:25px;font-weight:700}.brand-sub{font-size:15px;color:#64748b;margin-top:5px}.brand-text{display:flex;flex-direction:column}.title{font-size:78px;line-height:1;letter-spacing:-.055em;font-weight:800;max-width:500px;margin-bottom:28px;background:linear-gradient(135deg,#0b172a,#1769e8 60%,#0aa87b);-webkit-background-clip:text;background-clip:text;color:transparent}.desc{font-size:23px;line-height:1.42;max-width:470px;color:#26364b;margin-bottom:42px}.pills{display:flex;flex-wrap:wrap;gap:10px;max-width:480px}.pill{background:rgba(255,255,255,.86);border:1px solid rgba(11,23,42,.1);border-radius:999px;padding:11px 17px;font-size:15px;font-weight:600}.dot{display:inline-block;width:8px;height:8px;background:#1769e8;border-radius:50%;margin-right:8px}.right{position:absolute;left:650px;top:0;width:950px;height:900px}.badge{position:absolute;right:86px;top:92px;background:#0b172a;color:#fff;border-radius:999px;padding:13px 21px;font-weight:600;font-size:15px;z-index:2;box-shadow:0 15px 30px -14px #35506e}.card{position:absolute;left:22px;top:150px;width:820px;height:610px;border-radius:22px;background:#f4f6f8;padding:0;overflow:hidden;box-shadow:0 50px 90px -30px rgba(11,23,42,.42),0 12px 28px -10px rgba(11,23,42,.18);transform:rotate(-2deg)}.card img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}.shine{position:absolute;right:15px;bottom:64px;width:165px;height:165px;border-radius:50%;background:linear-gradient(145deg,#0b172a,#1769e8 58%,#2ee39e);box-shadow:0 25px 55px -20px #0b172a;transform:rotate(8deg);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:800}
</style></head><body><div class="stage"><section class="left"><div class="brand"><img id="brand-logo" class="icon"><div class="brand-text"><div class="brand-name">Pricefloor</div><div class="brand-sub">by Vayes</div></div></div><h1 class="title"></h1><p class="desc"></p><div class="pills"></div></section><section class="right"><div class="badge">Built for safer pricing</div><div class="card"><img id="shot-main"></div><div class="shine">↗</div></section></div></body></html>
